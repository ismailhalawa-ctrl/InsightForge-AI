[tool.poetry]
name = "insightforge-ai-backend"
version = "0.1.0"
description = "InsightForge AI backend — FastAPI service for content analysis, NLP, sentiment analysis, and LLM-powered insights."
authors = ["InsightForge AI"]
license = "MIT"
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
httpx = "^0.28.1"
langdetect = "^1.0.9"
emoji = "^2.12.1"
transformers = "^5.14.0"
torch = "^2.13.0"
sentencepiece = "^0.2.2"
protobuf = "^7.35.1"
sentence-transformers = "^5.0.0"
scikit-learn = "^1.7.0"
google-genai = "^2.0.0"
openai = "^2.0.0"
argon2-cffi = "^23.1.0"
pyjwt = "^2.9.0"
email-validator = "^2.0.0"
redis = "^5.0.0"
python-multipart = "^0.0.9"
openpyxl = "^3.1.0"
cryptography = "^49.0.0"
reportlab = "^4.5.1"
python-docx = "^1.2.0"
stripe = "^11.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
# Reads back the PDFs the export tests render. Asserting on byte length or a
# hash proves nothing about a PDF (reportlab stamps a creation time and a
# document id, so two renders of identical code differ), and the earlier
# GitHub export bug -- a document that was produced successfully and was
# nearly empty -- is invisible to any check that does not read the text.
pypdf = "^6.0"
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
